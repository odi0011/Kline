# ============ K线形态识别器 配置 ============

# 服务端口（网页 / 行情WebSocket）
web_port: 8000
ws_port: 8765

# 监控的合约（币安 USDT-M 永续，小写）。这是"监控池"：行情/形态检测对池内全部币种跑，
# 前端在菜单"选择币种"里勾选其中 4~10 个展示（选择持久化在浏览器本地）
symbols:
  - btcusdt
  - tslausdt
  - xauusdt
  - xagusdt
  - ethusdt
  - bnbusdt
  - solusdt
  - xrpusdt
  - dogeusdt
  - adausdt

# K线周期（支持 1s 5s 15s 30s 1m 3m 5m 15m 30m 1h 2h 4h 1d）
intervals:
  - 1m
  - 3m

# 数据源
feed:
  # auto=币安直连，反复无数据自动降级演示模式 | binance=只连币安 | demo=强制演示数据
  mode: auto
  # 本地网络连不上 fstream.binance.com 时填代理，如 socks5://127.0.0.1:7890 或 http://127.0.0.1:7890
  # 留空则自动读环境变量 WSS_PROXY / HTTPS_PROXY
  proxy: ""
  # 启动时回补的历史K线根数（给形态的趋势判断提供上下文）
  backfill_bars: 300

# 形态识别
patterns:
  # 启用哪些形态：all 或列 key（见 patterns/builtin.py）
  enabled: all
  # 盘中实时预警（K线未收线时形态一旦满足立即通知），收线后如仍满足会再发一次"确认"
  live_preview: true
  # 趋势判定窗口与阈值（收盘价相对前 N 根均值的偏离）
  trend_bars: 10
  trend_threshold: 0.002

# 通知
notify:
  # Windows 桌面弹窗（信号较多，容易打扰，默认关闭；网页右下角信号面板不受影响）
  toast: false
  sound: false
  # Webhook 推送（钉钉/飞书群机器人），不需要则 enabled: false
  webhook:
    enabled: false
    # dingtalk | feishu | raw
    type: dingtalk
    url: ""

# 安全（重要）：
#  1) 本文件里的密钥（MySQL 密码 / 交易所 API Key / AI key / Telegram token / Webhook URL）
#     支持加密保存：在服务器执行 python tools/encrypt_config.py，会备份后写成 enc:v1:...
#     并把密钥放在同目录 secrets.key（0600）。secrets.key 丢了就解不开，务必单独备份。
#  2) 也可以用环境变量覆盖（优先级最高）：
#     KLINE_MYSQL_PASSWORD / KLINE_AI_KEY / KLINE_TELEGRAM_TOKEN / KLINE_WEBHOOK_URL /
#     KLINE_ACCOUNT_API_KEY / KLINE_ACCOUNT_API_SECRET / KLINE_SECRET_KEY（加密主密钥）
#  3) 启动日志会提示哪些密钥仍是明文；本文件与 secrets.key 权限会被收紧到 0600。

# 存储层（MySQL，库/账号已在服务器创建，仅授权 kline 库）
mysql:
  host: 127.0.0.1
  port: 3306
  user: kline
  password: "你的MySQL密码"
  database: kline
  # 数据库 I/O 超时（秒；0 = 不设）。防止网络抖动时 5 秒交易循环被一个查询卡死。
  read_timeout: 30
  write_timeout: 30

storage:
  # K线滚动保留时长（分钟）
  minutes: 30
  # 各业务数据的保留期（天；0 = 永久保留）。做长期策略分析不要再按周删库。
  hit_days: 90             # 形态命中与胜负记录
  quant_trade_days: 365    # 实盘已平仓成交
  quant_event_days: 30     # 量化决策事件流水
  news_days: 7             # 新闻存档
  trace_days: 30           # 决策 trace / gate 拦截明细
  # 模拟仓（15 分钟纸上交易）平仓记录保留天数：0 = 永久保留。
  # 模拟仓数据用于长期策略复盘，建议保持 0；需要控制数据库体积再调小。
  paper_keep_days: 0
  # K线长期归档（回测用）：完整保存每根收线K线，0 = 永久保留。
  # 注意：归档量随时间增长（4币×2周期 1m 约 1 万行/天），磁盘紧张再设保留天数。
  candle_archive_days: 0
  # Agent 任务/对话/摘要进 MySQL；聊天记录保留天数，0 = 永久。
  # 内存里始终只保留最近 40 条对话，更早的只在库里可查。
  agent_chat_days: 0
  # 胜率判定：出现形态后10分钟内，价格先向形态方向走满 0.15% → 胜；先反向走满 → 负；都没走到 → 不计
  eval_minutes: 10
  eval_threshold: 0.0015

# 交易账户（系统里的「实盘账户」：真正下单、真正有权益与持仓的那一个）。
# 只支持一个账户（页面第一行的账户卡展示它的权益与持仓）。
# BASE 目前是币安合约测试网，用测试网 key 只是部署选择，不影响账户身份；
# 别把它跟「模拟仓」（每币 15 分钟纸上交易，不产生委托）混为一谈。
# 也可在页面「设置 → 账户」里填写并保存，会自动写回本文件。
accounts:
  - name: "主账户"
    api_key: "你的 API Key"
    api_secret: "你的 API Secret"
    icon: ""

# 信号同时落盘到 signals.csv
csv_log: signals.csv

# 量化决策层（纯后端；不会改变前端布局）
quant:
  enabled: true
  min_pattern_winrate: 0.35
  min_pattern_samples: 5
  # 只供后端计算 4h 方向闸 / 1h 确认规则，不会出现在前端周期选择里
  watch_timeframes: [1h, 4h]
  decision:
    enabled: true
    risk_enabled: true
    scoring_enabled: true
    watch_enabled: true
    exchange_protection: true
    maker_first: false

    minimum_score: 55
    minimum_score_gap: 15
    pattern_min_samples: 5
    pattern_min_winrate: 0.35
    pattern_winrate_alpha: 0.94
    pattern_window_days: 7

    daily_loss_limit_pct: 3
    daily_profit_lock_pct: 5
    consecutive_loss_limit: 4
    consecutive_loss_cooldown_min: 60
    drawdown_limit_pct: 5
    drawdown_pause_min: 30

    max_positions: 4
    max_same_direction: 3
    cooldown_base_sec: 300
    cooldown_max_sec: 7200
    portfolio_heat_max_pct: 6
    correlation_threshold: 0.80
    correlation_lookback: 200

    margin_pct_default: 5
    margin_pct_min: 2
    margin_pct_max: 8
    margin_min_usdt: 10
    risk_per_trade_pct: 1
    kelly_fraction: 0.25
    kelly_min_samples: 20
    high_vol_atr_pct: 85
    extreme_vol_atr_pct: 95
    high_vol_size_factor: 0.5

    max_notional_per_order: 60000
    max_orders_per_min: 10
    stale_trade_sec: 90
    stale_depth_sec: 15
    liquidation_window_sec: 300
    liquidation_min_events: 5
    liquidation_min_notional: 1000000
    liquidation_cooldown_sec: 900

    trail_atr_mult: 2.0
    trail_atr_n: 22
    trail_arm_atr: 1.0
    watch_min_h1_rules: 2
    # HMM 先影子记录，验证 lift 后再把 hmm_use_in_score 打开
    hmm_shadow: true
    hmm_use_in_score: false
    hmm_min_confidence: 0.60
    drift_enabled: true
    drift_delta: 0.002
    drift_caution_hours: 72
    drift_shadow_hours: 48

    # 标的池只产出建议，不自动替换；人工确认后改 symbols
    pool_audit_enabled: true
    pool_min_quote_volume: 50000000
    pool_min_age_days: 30
    pool_min_daily_range: 1.5
    pool_max_daily_range: 8
    pool_max_spread: 0.0005   # fraction = 0.05%
    pool_blacklist: []

    # UTC 时段；示例：["23:00-01:00"]。默认不启用，验证时段效应后再打开。
    session_blackouts_utc: []
    # 静态宏观事件黑窗；ISO 时间示例：
    # - {start: "2026-11-05T21:15:00Z", end: "2026-11-05T22:00:00Z", label: "FOMC"}
    macro_events: []
