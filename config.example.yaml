# ============ K线形态识别器 配置 ============

# 服务端口（网页 / 行情WebSocket）
web_port: 8000
ws_port: 8765

# 监控的合约（币安 USDT-M 永续，小写）。这是"监控池"：行情/形态检测对池内全部币种跑，
# 前端在菜单"选择币种"里勾选其中 4~10 个展示（选择持久化在浏览器本地）
symbols:
  - btcusdt
  - tslausdt
  - xauusdt
  - xagusdt
  - ethusdt
  - bnbusdt
  - solusdt
  - xrpusdt
  - dogeusdt
  - adausdt

# K线周期（支持 1s 5s 15s 30s 1m 3m 5m 15m 30m 1h 2h 4h 1d）
# 第一个 = 默认周期（前端默认选中 / 量化引擎取价 / Agent 读K线）。
# 为什么默认 1h：9 年跨周期回放（scripts/interval_study.py）显示
#   ATR/价格   1h 0.790% / 15m 0.286% / 3m 0.103%
#   双边4bps占ATR 10% / 28% / 77%
# 3m 上手续费吃掉 ATR 的 77%，短周期不是「更快」而是「更贵」。
# 注意：换周期不能把负期望变正（fee=0 时三周期仍全负），它只降低成本结构。
intervals:
  - 1h
  - 30m
  - 3m
  - 1m

# 数据源
feed:
  # auto=币安直连，反复无数据自动降级演示模式 | binance=只连币安 | demo=强制演示数据
  mode: auto
  # 本地网络连不上 fstream.binance.com 时填代理，如 socks5://127.0.0.1:7890 或 http://127.0.0.1:7890
  # 留空则自动读环境变量 WSS_PROXY / HTTPS_PROXY
  proxy: ""
  # 启动时回补的历史K线根数（给形态的趋势判断提供上下文）
  backfill_bars: 300

# Agent 联网搜索（web_search / read_web_page 两个工具，是否搜索由模型自己判断）
# 默认无 key 走 DuckDuckGo HTML，失败自动回退 Bing HTML；质量要求高可去 serper.dev
# 申请 key 并设置环境变量 KLINE_SERPER_KEY（无需改本文件）。
search:
  enabled: true
  # 代理留空则沿用 feed.proxy；海外服务器一般不用
  proxy: ""
  # 单次搜索超时（秒）
  timeout: 10
  # 默认返回条数（模型也可在 1~10 内自己调）
  count: 5

# Agent 表情包（在线贴纸）
# 申请地址：https://developers.giphy.com/dashboard/ → Create an App → 复制 API Key
# 免费 beta key 限 100 次/小时，所以命中过的图会下载到
# agent-attachments/stickers/ 并记住情绪词，之后同一个词只读本地文件。
# 没配 key 时只用内置三张图（web/public/stickers/），功能不受影响。
stickers:
  enabled: true
  # 填 GIPHY API Key；也可以用环境变量 KLINE_GIPHY_KEY（优先级更高，推荐）
  giphy_key: ""
  # 代理留空则沿用 search.proxy / feed.proxy
  proxy: ""
  # 搜索与下载超时（秒）
  timeout: 8

# 形态识别
patterns:
  # 启用哪些形态：all 或列 key（见 patterns/builtin.py）
  enabled: all
  # 盘中实时预警（K线未收线时形态一旦满足立即通知），收线后如仍满足会再发一次"确认"
  live_preview: true
  # 趋势判定窗口与阈值（收盘价相对前 N 根均值的偏离）
  trend_bars: 10
  trend_threshold: 0.002

# 通知
notify:
  # Webhook 推送（钉钉/飞书群机器人），不需要则 enabled: false
  webhook:
    enabled: false
    # dingtalk | feishu | raw
    type: dingtalk
    url: ""

# 安全（重要）：
#  1) 本文件里的密钥（MySQL 密码 / 交易所 API Key / AI key / Telegram token / Webhook URL）
#     支持加密保存：在服务器执行 python tools/encrypt_config.py，会备份后写成 enc:v1:...
#     并把密钥放在同目录 secrets.key（0600）。secrets.key 丢了就解不开，务必单独备份。
#  2) 也可以用环境变量覆盖（优先级最高）：
#     KLINE_MYSQL_PASSWORD / KLINE_AI_KEY / KLINE_TELEGRAM_TOKEN / KLINE_WEBHOOK_URL /
#     KLINE_ACCOUNT_API_KEY / KLINE_ACCOUNT_API_SECRET / KLINE_SECRET_KEY（加密主密钥）
#  3) 启动日志会提示哪些密钥仍是明文；本文件与 secrets.key 权限会被收紧到 0600。

# 存储层（MySQL，库/账号已在服务器创建，仅授权 kline 库）
mysql:
  host: 127.0.0.1
  port: 3306
  user: kline
  password: "你的MySQL密码"
  database: kline
  # 数据库 I/O 超时（秒；0 = 不设）。防止网络抖动时 5 秒交易循环被一个查询卡死。
  read_timeout: 30
  write_timeout: 30

storage:
  # K线滚动保留时长（分钟）
  minutes: 30
  # 各业务数据的保留期（天；0 = 永久保留）。做长期策略分析不要再按周删库。
  hit_days: 90             # 形态命中与胜负记录
  quant_trade_days: 365    # 实盘已平仓成交
  quant_event_days: 30     # 量化决策事件流水
  news_days: 7             # 新闻存档
  trace_days: 30           # 决策 trace / gate 拦截明细
  # 模拟仓（15 分钟纸上交易）平仓记录保留天数：0 = 永久保留。
  # 模拟仓数据用于长期策略复盘，建议保持 0；需要控制数据库体积再调小。
  paper_keep_days: 0
  # K线长期归档（回测用）：完整保存每根收线K线，0 = 永久保留。
  # 注意：归档量随时间增长（4币×2周期 1m 约 1 万行/天），磁盘紧张再设保留天数。
  candle_archive_days: 0
  # Agent 任务/对话/摘要进 MySQL；聊天记录保留天数，0 = 永久。
  # 内存里始终只保留最近 40 条对话，更早的只在库里可查。
  agent_chat_days: 0
  # 胜率判定：出现形态后 eval_minutes 分钟内，价格先向形态方向走满
  # 0.15% → 胜；先反向走满 → 负；都没走到 → 不计。
  # eval_min_bars 是长周期下限：窗口至少覆盖这么多根该周期的 K 线，
  # 否则 1h 信号在固定 10 分钟里一根 K 线都没有，全被误判成 no_data。
  # 1m/3m 仍按 10 分钟；30m→90 分钟、1h→3 小时。
  eval_minutes: 10
  eval_min_bars: 3
  eval_threshold: 0.0015

# 交易账户（系统里的「实盘账户」：真正下单、真正有权益与持仓的那一个）。
# 只支持一个账户（页面第一行的账户卡展示它的权益与持仓）。
# BASE 目前是币安合约测试网，用测试网 key 只是部署选择，不影响账户身份；
# 别把它跟「模拟仓」（每币 15 分钟纸上交易，不产生委托）混为一谈。
# 也可在页面「设置 → 账户」里填写并保存，会自动写回本文件。
accounts:
  - name: "主账户"
    api_key: "你的 API Key"
    api_secret: "你的 API Secret"
    icon: ""

# 信号同时落盘到 signals.csv
csv_log: signals.csv

# 量化决策层（纯后端；不会改变前端布局）
# 注意：decision 必须挂在 quant 下（main.py 读的是 quant.decision）。整段省略时
# 所有阈值走 DecisionConfig 默认值：minimum_score=55 / gap=15 / 黑窗为空。
# 阈值有没有区分力，先跑 scripts/signal_lift.py 做对照，再按证据调整。
quant:
  enabled: true
  min_pattern_winrate: 0.35
  min_pattern_samples: 5
  # 只供后端计算 4h 方向闸 / 1h 确认规则，不会出现在前端周期选择里
  watch_timeframes: [1h, 4h]
  decision:
    enabled: true
    risk_enabled: true
    scoring_enabled: true
    watch_enabled: true
    exchange_protection: true
    maker_first: false

    # ===== 2026-11-07 跨周期 / 衍生品复核（9 年历史仓，训练-验证分离）=====
    # 工具：scripts/interval_study.py、trend_robustness.py、derivatives_signal.py
    # · 周期越短，相对波动越小、手续费占比越高：
    #     ATR/价格      1h 0.790%  /  15m 0.286%  /  3m 0.103%
    #     双边 4bps 占 ATR   10%   /      28%    /     77%
    #   手续费归零时三周期期望仍 -0.337 / -0.112 / -0.115，说明信号本身没有
    #   edge —— "换周期"不能翻盘，反而更差（4 个收敛形态加过滤在 15m/3m
    #   没有一个样本外为正）。生产周期 1m/3m 是实盘事实，不是因为短周期更优。
    #   把 3m 止损按生产规则夹到 0.4%/rr3：胜率 32.9%→44.7%、笔数
    #   5683→4368，但 fee4 期望只从 -0.449 变 -0.442 —— 少被扫，仍不赚钱。
    # · 1h 上 trend>=1 过滤训练 +0.353 / 验证 +0.810 看似为正，稳健性复核否决：
    #   bootstrap 95% CI [-0.59, +2.37] 跨零、去掉最赚的 5 笔后 -0.109、
    #   三折里第 2 折 -1.23、15m/3m 完全不复现。**不要写进生产参数。**
    # · 资金费率 / 全市场多空比 / 大户多空比 / 主动买卖量比 / 持仓量变化
    #   五个衍生品特征，验证段 IC 方向保持全部 |<0.051|，无可用方向 edge。
    # → 纯 K 线形态在这套数据上没有可交易边际；优先停自动开仓做影子对照，
    #   不要继续加过滤器、换周期或换数据源。复核直接跑上面三个脚本。
    #
    # ===== 2026-11-09 复核（服务连续 44h；3293 笔干净回放 / 1271 条带评分决策）=====
    # 工具：scripts/signal_quality.py --days 30、signal_lift.py --days 7
    # · 稳定成立：只做空（前后半 short -0.042/-0.021 vs long -0.178/-0.082）；
    #   评分 >=55 与 gap >=30 仍反向但收窄（<55 48.9% vs >=55 44.4%，-4.5pp）；
    #   形态信号整体跑输随机入场（lift -0.0167）；闸门放行 47.1% /
    #   拦截 45.9% 几乎无差 → 闸门没有挑好信号的能力。
    # · 依据翻转（不要在证据不稳时继续硬拒）：trend 前半最差 -0.133、
    #   后半反而最好 -0.026；UTC 12-18 前半 -0.230 / 后半 -0.030；
    #   高噪声前半 -0.162 / 后半 -0.034；hammer、morning_star 后半接近 0。
    #   quality_trend_size_factor / quality_blackouts_utc /
    #   quality_pattern_blacklist 应转影子对照，而不是继续当硬规则。
    # · 首次出现两个前后半都为正的组合（short × noise=mid/atr=low n=154、
    #   short × noise=high/atr=mid n=178，期望 +0.12/+0.04 与 +0.03/+0.11），
    #   但样本小且来自网格搜索，属多重比较；先跟踪 30 天，不要直接上线。
    # · 注意口径差异：signal_quality 用 60min 动态止损回放，signal_lift 用
    #   10min 方向收益，两者对 trend 的结论相反，别混着解读。
    #
    # ===== 2026-11-09 放行/拦截并行影子对照（scripts/shadow_gate.py）=====
    # 824 笔可结算；两组用**完全相同**的 1m 回放规则（下一根开盘入场 /
    # 0.4% 止损 / rr3 / 最多 60 根 / 双边 4bps+1bp / 名义 1000 USDT），
    # 唯一差别就是闸门判定，因此期望差直接等于闸门的区分力：
    #     放行 271 笔  胜率 34.3%  期望 -0.1076%/笔
    #     拦截 553 笔  胜率 33.5%  期望 -0.0961%/笔
    #     放行增益 -0.0115 pp → 闸门反向（被拦的反而更好）
    # 四组参数（零成本 / 0.8%止损 rr1.5 / 20min 持仓 / 默认）结论一致，
    # 4 天里 3 天放行组更差；误杀率 33.5% ≈ 放行胜率 34.3%，说明闸门
    # 基本在随机砍掉 2/3 的信号，而不是挑出好信号。
    # 按拦截原因：高影线噪声 -0.0880、UTC 12-18 黑窗 -0.0864，都比放行组
    # (-0.1076) 好；只有形态黑名单 -0.1406 确实更差 → 前两条硬拒应考虑
    # 关闭或降为降仓，黑名单可保留。样本仅 3 天 824 笔，未擅自改生产参数。
    # 复核：venv/bin/python scripts/shadow_gate.py --days 30 --refresh
    #
    # ===== 2026-11-10 「胜率 40% 多是不是太烂」的诊断 =====
    # 胜率本身不能判断好坏，看 payout（均盈/均亏）决定的打平胜率：
    # 近 7 天剔除 removed 3756 笔，均盈 +1.770 / 均亏 -1.657，
    # payout 仅 1.068 → 打平胜率 48.4%；实际 49.0% 只是勉强微利 +85.84。
    # 名义 SL 0.4% / TP 1.2%（rr 3.0，过滤贴脸止损后中位确为 3.000），
    # 但真正触发止盈 tp 只有 35 笔；绝大多数仓位在 3 分钟自检时
    # +0.20% 判赢 / -0.15% 判亏就平了，实际只兑现约 1.07 的盈亏比。
    # **不要把自检阈值放大到名义止盈**：shadow_gate 的 1m 回放显示
    # 0.4%/rr3/60min 下 target 只达成 5.8%、stop 37%、timeout 57%，
    # 期望 -0.1076%/笔，比模拟仓短打 (+0.0229/笔) 更差 —— 当前信号
    # 在 60 分钟内摸不到 +1.2%。放大止盈会亏更多，别拧这个方向。
    # 真正该减的是短反手磨损（见 paper_flip_min_hold_min）。
    #
    # 校准状态（2026-11-06，scripts/param_sweep.py + signal_lift.py 实机回放）：
    # 7 天 2809 笔 / 30 天 4094 笔，同根双触判止损、扣双边 0.1% 成本。
    # 只做空 +0.071 / +0.389 %每笔；做多 -0.185 / -1.231 %每笔 → 只做空。
    # 当前 55/15 门槛选出的信号 -0.142 %每笔，比不过滤 -0.071 更差 → 关硬门槛。
    allow_long: false
    score_gate_enabled: false
    # 一键影子模式：false = 信号 / 模拟仓 / 决策流水照常，但停止真实下单。
    # 回放显示自动开仓整体仍是负期望，确认策略前可先关掉，别继续付手续费。
    auto_trade_enabled: true
    # 模拟仓反手最小持有时间（分钟）；0 = 恢复旧行为（中间地带立刻反手）。
    # 实机 7 天：check_flip 992 笔、合计 -248.70，71% 在 10 分钟内、
    # 41.7% 在 5 分钟内，中位 6 分钟；剔除反手后其余交易胜率 56.9%
    # （含反手 49.0%）。decision/paper.py 文件头设计第 5 条本来就写着
    # 「方向翻转不提前离场」，旧实现却在第一次自检就允许反手。
    paper_flip_min_hold_min: 15
    # watch_plan 的止损夹紧区间（小数，0.004 = 0.4%）。这是 _decide_open 的
    # 首选分支，不夹紧的话低波动时止损只剩 0.1~0.2%，几分钟就被噪声扫掉。
    watch_sl_min_pct: 0.004
    watch_sl_max_pct: 0.020
    # 信号质量门：2026-11-11 按影子对照（824 笔、四组参数一致）调过。
    # 放行组 -0.1076%/笔 vs 拦截组 -0.0961%，闸门是反向的；按原因拆
    # 高影线噪声 -0.0880、UTC 12-18 -0.0864 都优于放行组，只有
    # 形态黑名单 -0.1406 确实更差。11-09 复核又发现 trend 前后半翻转。
    # 因此关掉两条硬拒与趋势降仓，只保留黑名单；要回滚旧规则就填：
    #   quality_blackouts_utc: ["12:00-18:00"]
    #   quality_noise_reject: 0.45
    #   quality_trend_size_factor: 0.5
    # 注意这些依据来自 1m/3m 信号，默认周期改 1h 后请用
    # scripts/shadow_gate.py 重新积累 1h 样本复核，别直接当成 1h 结论。
    quality_enabled: true
    quality_blackouts_utc: []
    quality_noise_reject: 1.0       # >=1.0 = 不硬拒（仍可降仓）
    quality_noise_low: 0.36         # q33，只降仓
    quality_trend_size_factor: 1.0  # 前后半翻转，不再默认降仓
    quality_extreme_vol_size_factor: 0.7
    quality_high_score_size_factor: 0.8
    quality_high_gap: 30
    quality_pattern_blacklist: [morning_star, hammer, bullish_harami, tweezer_bottom]
    # 阈值仍保留用于分档与影子对照；要复核旧逻辑把 score_gate_enabled 打开。
    minimum_score: 55
    minimum_score_gap: 15
    pattern_min_samples: 5
    pattern_min_winrate: 0.35
    pattern_winrate_alpha: 0.94
    pattern_window_days: 7

    daily_loss_limit_pct: 3
    daily_profit_lock_pct: 5
    consecutive_loss_limit: 4
    consecutive_loss_cooldown_min: 60
    drawdown_limit_pct: 5
    drawdown_pause_min: 30

    max_positions: 4
    max_same_direction: 3
    cooldown_base_sec: 300
    cooldown_max_sec: 7200
    portfolio_heat_max_pct: 6
    correlation_threshold: 0.80
    correlation_lookback: 200

    margin_pct_default: 5
    margin_pct_min: 2
    margin_pct_max: 8
    margin_min_usdt: 10
    risk_per_trade_pct: 1
    kelly_fraction: 0.25
    kelly_min_samples: 20
    high_vol_atr_pct: 85
    extreme_vol_atr_pct: 95
    high_vol_size_factor: 0.5

    max_notional_per_order: 60000
    max_orders_per_min: 10
    stale_trade_sec: 90
    stale_depth_sec: 15
    liquidation_window_sec: 300
    liquidation_min_events: 5
    liquidation_min_notional: 1000000
    liquidation_cooldown_sec: 900

    trail_atr_mult: 2.0
    trail_atr_n: 22
    trail_arm_atr: 1.0
    watch_min_h1_rules: 2
    # HMM 先影子记录，验证 lift 后再把 hmm_use_in_score 打开
    hmm_shadow: true
    hmm_use_in_score: false
    hmm_min_confidence: 0.60
    drift_enabled: true
    drift_delta: 0.002
    drift_caution_hours: 72
    drift_shadow_hours: 48

    # 标的池只产出建议，不自动替换；人工确认后改 symbols
    pool_audit_enabled: true
    pool_min_quote_volume: 50000000
    pool_min_age_days: 30
    pool_min_daily_range: 1.5
    pool_max_daily_range: 8
    pool_max_spread: 0.0005   # fraction = 0.05%
    pool_blacklist: []

    # UTC 时段黑窗，支持跨午夜。[] = 完全不启用（线上当前状态）。
    # 启用示例：session_blackouts_utc: ["23:00-01:00", "12:00-13:00"]
    session_blackouts_utc: []
    # 静态宏观事件黑窗（UTC ISO 时间）。[] = 完全不启用（线上当前状态）。
